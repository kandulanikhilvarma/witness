name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: node scripts/check-contrast.mjs # design tokens must keep text at WCAG AA
      - run: npm run build # next build typechecks; generates .next/types (LayoutProps etc.)
      - run: node scripts/check-mermaid.mjs
      # Browser run with axe: public pages, the console upload loop, a phone
      # viewport. Playwright starts and stops its own server on :3000.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
      # End to end against the built app. With no environment variables set, the
      # app runs the keyless PGlite demo, so the whole ingest-to-export loop is
      # exercised without a Supabase project or a model key.
      - name: Smoke test the ingest loop
        run: |
          npm start &
          npm test

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts api
      - run: python scripts/check-licences.py
      - run: pip install -r requirements.txt
      - run: python api/patchcore.py # the anomaly function's own self-check

  # Keep the README figures in sync with the drawing geometry. On every push to
  # master this regenerates docs/assets from src/lib/mech.ts and commits the
  # result only when it changed. The commit uses GITHUB_TOKEN, whose pushes do
  # not start new workflow runs, so there is no loop; the [skip ci] tag is a
  # second guard. gen-diagrams.ts needs Node 22 for TypeScript type stripping.
  diagrams:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/gen-diagrams.ts
      - name: Commit regenerated figures if they changed
        run: |
          if [ -n "$(git status --porcelain docs/assets)" ]; then
            git config user.name "witness-ci"
            git config user.email "ci@users.noreply.github.com"
            git add docs/assets
            git commit -m "Regenerate README figures [skip ci]"
            git push
          else
            echo "figures already in sync"
          fi
